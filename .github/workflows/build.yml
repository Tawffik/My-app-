                      style = MaterialTheme.typography.bodySmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant
                  )
                  Spacer(Modifier.height(16.dp))

                  when {
                      review.queue.isEmpty() -> {
                          Card(modifier = Modifier.fillMaxWidth()) {
                              Column(
                                  Modifier
                                      .fillMaxWidth()
                                      .padding(24.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  Text("مفيش كروت مستحقة دلوقتي", style = MaterialTheme.typography.titleMedium)
                                  Spacer(Modifier.height(8.dp))
                                  Text(
                                      "ارجع بكرة — الجدولة بتحسب ميعاد كل كارت.",
                                      color = MaterialTheme.colorScheme.onSurfaceVariant
                                  )
                              }
                          }
                      }

                      review.done -> {
                          Card(modifier = Modifier.fillMaxWidth()) {
                              Column(
                                  Modifier
                                      .fillMaxWidth()
                                      .padding(24.dp),
                                  horizontalAlignment = Alignment.CenterHorizontally
                              ) {
                                  Text(
                                      "خلصت الجلسة!",
                                      style = MaterialTheme.typography.titleLarge,
                                      color = MaterialTheme.colorScheme.primary
                                  )
                                  Spacer(Modifier.height(8.dp))
                                  Text("راجعت ${review.reviewedCount} كارت (+${review.reviewedCount * 2} XP)")
                                  Spacer(Modifier.height(16.dp))
                                  Button(onClick = { review.start() }) {
                                      Text("جلسة جديدة (لو فيه كروت مستحقة)")
                                  }
                              }
                          }
                      }

                      else -> {
                          val card = review.current()
                          if (card != null) {
                              Text(
                                  "البطاقة ${review.index + 1} من ${review.queue.size}",
                                  style = MaterialTheme.typography.labelMedium,
                                  color = MaterialTheme.colorScheme.onSurfaceVariant
                              )
                              card.topicId?.let {
                                  Text(
                                      CyberCurriculum.topicTitle(it),
                                      style = MaterialTheme.typography.labelSmall,
                                      color = MaterialTheme.colorScheme.primary
                                  )
                              }
                              Spacer(Modifier.height(8.dp))
                              Card(modifier = Modifier.fillMaxWidth()) {
                                  Column(Modifier.padding(20.dp)) {
                                      Text(
                                          card.question,
                                          style = MaterialTheme.typography.titleLarge
                                      )
                                      Spacer(Modifier.height(12.dp))
                                      if (review.revealed) {
                                          Text(
                                              card.answer,
                                              style = MaterialTheme.typography.bodyLarge,
                                              color = MaterialTheme.colorScheme.primary
                                          )
                                      }
                                  }
                              }
                              Spacer(Modifier.height(16.dp))
                              if (!review.revealed) {
                                  Button(
                                      onClick = { review.reveal() },
                                      modifier = Modifier.fillMaxWidth()
                                  ) {
                                      Text("اظهر الإجابة")
                                  }
                              } else {
                                  Row(
                                      Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                                  ) {
                                      OutlinedButton(
                                          onClick = {
                                              review.grade(SrsScheduler.AGAIN)
                                              progress.addXp(2)
                                          },
                                          modifier = Modifier.weight(1f)
                                      ) {
                                          Text("تاني", color = MaterialTheme.colorScheme.error)
                                      }
                                      OutlinedButton(
                                          onClick = {
                                              review.grade(SrsScheduler.HARD)
                                              progress.addXp(2)
                                          },
                                          modifier = Modifier.weight(1f)
                                      ) {
                                          Text("صعب")
                                      }
                                      OutlinedButton(
                                          onClick = {
                                              review.grade(SrsScheduler.GOOD)
                                              progress.addXp(2)
                                          },
                                          modifier = Modifier.weight(1f)
                                      ) {
                                          Text("كويس")
                                      }
                                      Button(
                                          onClick = {
                                              review.grade(SrsScheduler.EASY)
                                              progress.addXp(2)
                                          },
                                          modifier = Modifier.weight(1f)
                                      ) {
                                          Text("سهل")
                                      }
                                  }
                              }
                          }
                      }
                  }
              }
