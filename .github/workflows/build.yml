                  if (q.isEmpty()) return notes
                  return notes.filter { note ->
                      note.title.contains(q, ignoreCase = true) ||
                          note.body.contains(q, ignoreCase = true) ||
                          note.tags.any { it.contains(q, ignoreCase = true) }
                  }
              }
          }
