          @Composable
          fun NotesScreen(state: NotesState, onOpen: (Long) -> Unit) {
              var deleteTarget by remember { mutableStateOf<Note?>(null) }

              Column(Modifier.fillMaxSize().padding(horizontal = 16.dp)) {
                  Spacer(Modifier.height(8.dp))
                  OutlinedTextField(
                      value = state.query, onValueChange = { state.query = it },
                      modifier = Modifier.fillMaxWidth(),
                      placeholder = { Text(Lang.t("Search...", "بحث...")) },
                      leadingIcon = { Icon(Icons.Filled.Search, null) },
                      singleLine = true
                  )
                  Spacer(Modifier.height(8.dp))

                  val list = state.filtered()
                  if (list.isEmpty()) {
                      EmptyState(
                          if (state.query.isBlank()) Lang.t("No notes yet — tap +", "مفيش ملاحظات — اضغط +")
                          else Lang.t("No matching results.", "مفيش نتائج.")
                      )
                  } else {
                      LazyColumn(verticalArrangement = Arrangement.spacedBy(8.dp), contentPadding = PaddingValues(bottom = 16.dp)) {
                          items(list, key = { it.id }) { note ->
                              NoteCard(note = note, onOpen = { onOpen(note.id) }, onDelete = { deleteTarget = note })
                          }
                      }
                  }
              }

              if (deleteTarget != null) {
                  AlertDialog(
                      onDismissRequest = { deleteTarget = null },
                      title = { Text(Lang.t("Delete note?", "حذف الملاحظة؟")) },
                      text = { Text(Lang.t("This cannot be undone.", "مش هتقدر تستعيدها.")) },
                      confirmButton = { TextButton({ deleteTarget?.let { state.delete(it.id) }; deleteTarget = null }) { Text(Lang.t("Delete", "حذف"), color = MaterialTheme.colorScheme.error) } },
                      dismissButton = { TextButton({ deleteTarget = null }) { Text(Lang.t("Cancel", "إلغاء")) } }
                  )
              }
          }

          @Composable
