                          TaskFields.MEDIUM to "متوسطة 🟡",
                          TaskFields.LOW to "منخفضة 🟢"
                      ).forEach { (value, label) ->
                          FilterChip(
                              selected = priority == value,
                              onClick = { priority = value },
                              label = { Text(label) }
                          )
                      }
                  }

                  Spacer(Modifier.height(10.dp))
                  Text("المشروع", style = MaterialTheme.typography.labelLarge)
                  Row(
                      horizontalArrangement = Arrangement.spacedBy(6.dp),
                      modifier = Modifier.horizontalScroll(rememberScrollState())
                  ) {
                      FilterChip(
                          selected = projectId == null,
                          onClick = { projectId = null },
                          label = { Text("بدون مشروع") }
                      )
                      projects.forEach { p ->
                          FilterChip(
                              selected = projectId == p.id,
                              onClick = { projectId = p.id },
                              label = { Text("${p.emoji} ${p.title}") }
                          )
                      }
                  }

                  Spacer(Modifier.height(10.dp))
                  Text("تاريخ الاستحقاق", style = MaterialTheme.typography.labelLarge)
                  Spacer(Modifier.height(6.dp))
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      Text(
                          dueLabel(dueDay) ?: "بدون تاريخ",
                          style = MaterialTheme.typography.bodyMedium,
                          color = if (dueDay != null) MaterialTheme.colorScheme.primary
                              else MaterialTheme.colorScheme.onSurfaceVariant,
                          modifier = Modifier.weight(1f)
                      )
                      Button(onClick = { showPicker = true }) {
                          Text("اختر")
                      }
                      if (dueDay != null) {
                          OutlinedButton(onClick = { dueDay = null }) {
                              Text("إزالة")
                          }
                      }
                  }

                  Spacer(Modifier.height(20.dp))
                  Button(
                      onClick = {
                          onSave(title, notes, status, priority, projectId, dueDay)
                      },
                      enabled = title.isNotBlank(),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("حفظ")
                  }

                  if (task != null) {
                      Spacer(Modifier.height(10.dp))
                      OutlinedButton(
                          onClick = { confirmDelete = true },
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Icon(
