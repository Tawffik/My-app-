          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.ArrowBack
          import androidx.compose.material3.AlertDialog
          import androidx.compose.material3.Button
          import androidx.compose.material3.LinearProgressIndicator
          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.OutlinedButton
          import androidx.compose.material3.OutlinedTextField
          import androidx.compose.material3.Text
          import androidx.compose.material3.TextButton
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.unit.dp
          import com.cyberos.app.data.ProjectState
          import com.cyberos.app.data.Task
          import com.cyberos.app.data.TaskFields
          import com.cyberos.app.data.TaskState
          import com.cyberos.app.learning.ProgressState
          import com.cyberos.app.ui.EmptyState

          @Composable
          fun ProjectDetailScreen(
              projectState: ProjectState,
              taskState: TaskState,
              progress: ProgressState,
              id: Long,
              onBack: () -> Unit,
              onOpenTask: (Long) -> Unit
          ) {
              val p = projectState.get(id)
              if (p == null) {
                  Column(Modifier.fillMaxSize()) {
                      OutlinedButton(onClick = onBack) { Text("رجوع") }
                      EmptyState("المشروع غير موجود")
                  }
                  return
              }

              var title by remember(p.id) { mutableStateOf(p.title) }
              var newTask by remember { mutableStateOf("") }
              var deleteTaskTarget by remember { mutableStateOf<Task?>(null) }
              var confirmDeleteProject by remember { mutableStateOf(false) }

              val projectTasks = taskState.tasks.filter { it.projectId == id }
              val doneCount = projectTasks.count { it.status == TaskFields.DONE }
              val frac = if (projectTasks.isEmpty()) 0f
                  else doneCount.toFloat() / projectTasks.size

              Column(Modifier.fillMaxSize().padding(16.dp)) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      OutlinedButton(onClick = onBack) {
                          Text(p.emoji)
                      }
                      Spacer(Modifier.width(8.dp))
                      Text("${p.emoji} ${p.title}", style = MaterialTheme.typography.titleLarge)
                  }

                  Spacer(Modifier.height(10.dp))
                  LinearProgressIndicator(
                      progress = { frac },
                      modifier = Modifier.fillMaxWidth()
                  )
                  Spacer(Modifier.height(4.dp))
                  Text(
                      "$doneCount من ${projectTasks.size} مهام مكتملة",
                      style = MaterialTheme.typography.labelSmall,
                      color = MaterialTheme.colorScheme.primary
                  )

                  Spacer(Modifier.height(10.dp))
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      OutlinedTextField(
                          value = newTask,
                          onValueChange = { newTask = it },
                          modifier = Modifier.weight(1f),
                          placeholder = { Text("مهمة جديدة للمشروع...") },
                          singleLine = true
                      )
                      Button(
                          onClick = {
                              taskState.upsert(
                                  -1L, newTask, "", TaskFields.TODO, TaskFields.MEDIUM, id, null
                              )
                              newTask = ""
                          },
                          enabled = newTask.isNotBlank()
                      ) {
                          androidx.compose.material3.Icon(
                              Icons.Filled.Add,
                              contentDescription = null
                          )
                      }
                  }

                  Spacer(Modifier.height(10.dp))
                  if (projectTasks.isEmpty()) {
                      Text(
                          "مفيش مهام في المشروع ده لسه.",
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                          style = MaterialTheme.typography.bodySmall
                      )
                  } else {
                      LazyColumn(
                          modifier = Modifier.weight(1f),
                          verticalArrangement = Arrangement.spacedBy(6.dp)
                      ) {
                          items(projectTasks, key = { it.id }) { t ->
                              TaskCard(
                                  task = t,
                                  projectName = null,
                                  onOpen = { onOpenTask(t.id) },
                                  onToggle = {
                                      val wasDone = t.status == TaskFields.DONE
                                      taskState.toggleDone(t.id)
                                      if (!wasDone) progress.addXp(5)
                                  },
                                  onDelete = { deleteTaskTarget = t }
                              )
                          }
                      }
                  }

                  Spacer(Modifier.height(10.dp))
                  OutlinedTextField(
                      value = title,
                      onValueChange = { title = it },
                      modifier = Modifier.fillMaxWidth(),
                      label = { Text("تعديل اسم المشروع") },
                      singleLine = true
                  )
                  Spacer(Modifier.height(6.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Button(
                          onClick = { projectState.rename(id, title) },
                          modifier = Modifier.weight(1f)
                      ) {
                          Text("حفظ الاسم")
                      }
                      OutlinedButton(
                          onClick = { confirmDeleteProject = true },
                          modifier = Modifier.weight(1f)
                      ) {
                          Text("حذف المشروع", color = MaterialTheme.colorScheme.error)
                      }
                  }
              }

              if (deleteTaskTarget != null) {
                  AlertDialog(
                      onDismissRequest = { deleteTaskTarget = null },
                      title = { Text("حذف المهمة؟") },
                      text = { Text("المهمة هتتمسح نهائيًا.") },
                      confirmButton = {
                          TextButton(onClick = {
                              deleteTaskTarget?.let { taskState.delete(it.id) }
                              deleteTaskTarget = null
                          }) {
                              Text("حذف", color = MaterialTheme.colorScheme.error)
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { deleteTaskTarget = null }) { Text("إلغاء") }
                      }
                  )
              }

              if (confirmDeleteProject) {
                  AlertDialog(
