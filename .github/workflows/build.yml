          package com.cyberos.app

          import com.cyberos.app.data.Redactor
          import org.junit.Assert.assertEquals
          org.junit.Assert.assertTrue
          import org.junit.Assert.assertFalse
          import org.junit.Test

          class RedactorTest {

              @Test
              fun provider_api_key_is_hidden() {
                  val r = Redactor.redact("my key is sk-AbCdEf1234567890GhIjKl in the config")
                  assertTrue(r.text.contains("[REDACTED]"))
                  assertFalse(r.text.contains("sk-AbCdEf1234567890GhIjKl"))
                  assertTrue(r.found >= 1)
              }

              @Test
              fun bearer_token_is_hidden_with_label() {
                  val r = Redactor.redact("Authorization: Bearer abcdef123456789")
                  assertTrue(r.text.contains("Bearer [REDACTED]"))
                  assertFalse(r.text.contains("abcdef123456789"))
              }

              @Test
              fun jwt_is_hidden() {
                  val jwt = "eyJhbGciOiJIUzI1NiIs.eyJzdWIiOiIxMjM0NTY3ODkwIn0.SflKxwRJSMeKKF2QT4"
                  val r = Redactor.redact("token: $jwt")
                  assertTrue(r.text.contains("[REDACTED"))
                  assertFalse(r.text.contains("SflKxwRJSMeKKF2QT4"))
              }

              @Test
              fun labeled_secret_keeps_label_but_hides_value() {
                  val r = Redactor.redact("api_key=supersecretvalue123")
                  assertTrue(r.text.contains("api_key=[REDACTED]"))
                  assertFalse(r.text.contains("supersecretvalue123"))
              }

              @Test
              fun normal_text_is_untouched() {
                  val text = "What is SQL injection and how does union select work?"
                  val r = Redactor.redact(text)
                  assertEquals(0, r.found)
