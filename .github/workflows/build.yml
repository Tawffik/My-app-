          import org.junit.Assert.assertEquals
          import org.junit.Assert.assertTrue
          import org.junit.Test

          class SrsSchedulerTest {

              private val now = 1_000_000_000_000L

              private fun card() = Flashcard(id = 1, topicId = null, question = "q", answer = "a")

              @Test
              fun good_grows_interval_by_ease() {
                  val c1 = SrsScheduler.schedule(card(), SrsScheduler.GOOD, now)
                  assertEquals(1.0, c1.intervalDays, 0.001)
                  val c2 = SrsScheduler.schedule(c1, SrsScheduler.GOOD, now)
                  assertEquals(2.5, c2.intervalDays, 0.001)
              }

              @Test
              fun again_resets_progress() {
                  val c1 = SrsScheduler.schedule(card(), SrsScheduler.GOOD, now)
                  val c2 = SrsScheduler.schedule(c1, SrsScheduler.AGAIN, now)
                  assertEquals(0.0, c2.intervalDays, 0.001)
                  assertEquals(0, c2.reps)
              }

              @Test
              fun ease_has_floor() {
                  var c = card()
                  repeat(10) { c = SrsScheduler.schedule(c, SrsScheduler.AGAIN, now) }
                  assertTrue(c.ease >= 1.3)
              }

