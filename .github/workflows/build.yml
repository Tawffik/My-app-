          cat > app/src/main/java/com/cyberos/app/data/Note.kt <<'CYBEREOF'
          package com.cyberos.app.data

          data class Note(
              val id: Long,
              val title: String,
              val body: String,
              val tags: List<String> = emptyList(),
              val createdAt: Long = 0L,
              val updatedAt: Long = 0L
          )
          CYBEREOF

          cat > app/src/main/java/com/cyberos/app/data/TaskProject.kt <<'CYBEREOF'
          package com.cyberos.app.data

          import android.content.Context
          import java.io.File

          object TaskFields {
              const val TODO = "TODO"
              const val IN_PROGRESS = "IN_PROGRESS"
              const val DONE = "DONE"
              const val HIGH = "HIGH"
              const val MEDIUM = "MEDIUM"
              const val LOW = "LOW"
          }

          data class Task(
              val id: Long,
              val title: String,
              val notes: String = "",
              val status: String = TaskFields.TODO,
              val priority: String = TaskFields.MEDIUM,
              val projectId: Long? = null,
              val dueDay: Long? = null,
              val createdAt: Long = 0L,
              val updatedAt: Long = 0L,
              val completedAt: Long? = null
          )

          data class Project(
              val id: Long,
              val title: String,
              val emoji: String = "📁",
              val createdAt: Long = 0L
          )

          class TaskStore(context: Context) {

              private val file: File = File(context.filesDir, "tasks.json")
              private var cache: MutableList<Task> = load()

              fun all(): List<Task> = cache.sortedByDescending { it.updatedAt }

              fun get(id: Long): Task? = cache.firstOrNull { it.id == id }

              fun nextId(): Long = (cache.maxOfOrNull { it.id } ?: 0L) + 1L

              @Synchronized
              fun save(task: Task) {
                  val index = cache.indexOfFirst { it.id == task.id }
                  if (index >= 0) cache[index] = task else cache.add(task)
                  persist()
              }

              @Synchronized
              fun delete(id: Long) {
                  cache.removeAll { it.id == id }
                  persist()
              }

              fun toJson(): String = JsonCodec.tasksToJson(cache)

              @Synchronized
              fun replaceAll(text: String) {
                  cache = try {
                      JsonCodec.parseTasks(text).toMutableList()
                  } catch (_: Exception) {
                      mutableListOf()
                  }
                  persist()
              }

              private fun persist() {
                  try { file.writeText(toJson()) } catch (_: Exception) { }
              }

              private fun load(): MutableList<Task> {
                  if (!file.exists()) return mutableListOf()
                  return try {
                      JsonCodec.parseTasks(file.readText()).toMutableList()
                  } catch (_: Exception) {
                      mutableListOf()
                  }
              }
          }

          class ProjectStore(context: Context) {

              private val file: File = File(context.filesDir, "projects.json")
              private var cache: MutableList<Project> = load()

              fun all(): List<Project> = cache.sortedByDescending { it.createdAt }

              fun get(id: Long): Project? = cache.firstOrNull { it.id == id }

              fun nextId(): Long = (cache.maxOfOrNull { it.id } ?: 0L) + 1L

              @Synchronized
              fun save(p: Project) {
                  val index = cache.indexOfFirst { it.id == p.id }
                  if (index >= 0) cache[index] = p else cache.add(p)
                  persist()
              }

              @Synchronized
              fun delete(id: Long) {
                  cache.removeAll { it.id == id }
                  persist()
              }

              fun toJson(): String = JsonCodec.projectsToJson(cache)

              @Synchronized
              fun replaceAll(text: String) {
                  cache = try {
                      JsonCodec.parseProjects(text).toMutableList()
                  } catch (_: Exception) {
                      mutableListOf()
                  }
                  persist()
              }

              private fun persist() {
                  try { file.writeText(toJson()) } catch (_: Exception) { }
              }

              private fun load(): MutableList<Project> {
                  if (!file.exists()) return mutableListOf()
                  return try {
                      JsonCodec.parseProjects(file.readText()).toMutableList()
                  } catch (_: Exception) {
                      mutableListOf()
                  }
              }
          }
          CYBEREOF

          cat > app/src/main/java/com/cyberos/app/data/TaskProjectState.kt <<'CYBEREOF'
          package com.cyberos.app.data

          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue
          import java.time.LocalDate

          class TaskState(private val store: TaskStore) {

              var tasks by mutableStateOf(store.all())
                  private set

              var filter by mutableStateOf("ALL")

              fun refresh() { tasks = store.all() }

              fun get(id: Long): Task? = store.get(id)

              fun delete(id: Long) {
                  store.delete(id)
                  tasks = store.all()
              }

              fun toggleDone(id: Long) {
                  val t = store.get(id) ?: return
                  val now = System.currentTimeMillis()
                  if (t.status == TaskFields.DONE) {
                      store.save(t.copy(status = TaskFields.TODO, completedAt = null, updatedAt = now))
                  } else {
                      store.save(t.copy(status = TaskFields.DONE, completedAt = now, updatedAt = now))
                  }
                  tasks = store.all()
              }

              fun upsert(
                  existingId: Long,
                  title: String,
                  notes: String,
                  status: String,
                  priority: String,
                  projectId: Long?,
                  dueDay: Long?
              ) {
                  val t = title.trim()
                  if (t.isEmpty()) return
                  val now = System.currentTimeMillis()
                  if (existingId > 0) {
                      val old = store.get(existingId) ?: return
                      store.save(
                          old.copy(
                              title = t,
                              notes = notes,
                              status = status,
                              priority = priority,
                              projectId = projectId,
                              dueDay = dueDay,
                              updatedAt = now,
                              completedAt = if (status == TaskFields.DONE) (old.completedAt ?: now) else null
                          )
                      )
                  } else {
                      store.save(
                          Task(
                              id = store.nextId(),
                              title = t,
                              notes = notes,
                              status = status,
                              priority = priority,
                              projectId = projectId,
                              dueDay = dueDay,
                              createdAt = now,
                              updatedAt = now,
                              completedAt = if (status == TaskFields.DONE) now else null
                          )
                      )
                  }
                  tasks = store.all()
              }

              fun detachFromProject(pid: Long) {
                  val now = System.currentTimeMillis()
                  tasks.filter { it.projectId == pid }.forEach {
                      store.save(it.copy(projectId = null, updatedAt = now))
                  }
                  tasks = store.all()
              }

              private val priorityRank = mapOf(
                  TaskFields.HIGH to 0,
                  TaskFields.MEDIUM to 1,
                  TaskFields.LOW to 2
              )

              fun filtered(): List<Task> {
                  val today = LocalDate.now().toEpochDay()
                  val base = when (filter) {
                      "TODAY" -> tasks.filter { it.status != TaskFields.DONE && it.dueDay != null && it.dueDay == today }
                      "OVERDUE" -> tasks.filter { it.status != TaskFields.DONE && it.dueDay != null && it.dueDay < today }
                      "OPEN" -> tasks.filter { it.status != TaskFields.DONE }
                      "DONE" -> tasks.filter { it.status == TaskFields.DONE }
                      else -> tasks
                  }
                  return base.sortedWith(
                      compareBy(
                          { it.status == TaskFields.DONE },
                          { it.dueDay ?: Long.MAX_VALUE },
                          { priorityRank[it.priority] ?: 1 }
                      )
                  )
              }
          }

          class ProjectState(private val store: ProjectStore) {

              var list by mutableStateOf(store.all())
                  private set

              fun refresh() { list = store.all() }

              fun get(id: Long): Project? = store.get(id)

              fun create(title: String): Long {
                  val t = title.trim()
                  if (t.isEmpty()) return -1L
                  val id = store.nextId()
                  store.save(Project(id = id, title = t, createdAt = System.currentTimeMillis()))
                  list = store.all()
                  return id
              }

              fun rename(id: Long, title: String) {
                  val p = store.get(id) ?: return
                  val t = title.trim()
                  if (t.isEmpty()) return
                  store.save(p.copy(title = t))
                  list = store.all()
              }

              fun delete(id: Long) {
                  store.delete(id)
                  list = store.all()
              }
          }
          CYBEREOF

          cat > app/src/main/java/com/cyberos/app/data/Redactor.kt <<'CYBEREOF'
          package com.cyberos.app.data

          // Detects secrets in text before it is sent to an external AI provider.
          // Auto-redacts and reports what was hidden. Secure by default.
          object Redactor {

              data class Result(val text: String, val found: Int)

              fun redact(text: String): Result {
                  var count = 0
                  var out = text

                  // Provider-style API keys: sk-..., gsk_..., rk-...
                  val keyRe = Regex("\\b(?:sk|gsk|rk|xai|rsk)[-_][A-Za-z0-9_-]{16,}\\b")
                  count += keyRe.findAll(out).count()
                  out = keyRe.replace(out, "[REDACTED]")

                  // Authorization: <value> header
                  val authRe = Regex("(?i)\\b(authorization)\\s*:\\s*\\S+")
                  count += authRe.findAll(out).count()
                  out = authRe.replace(out) { "Authorization: [REDACTED]" }

                  // Bearer tokens
                  val bearerRe = Regex("(?i)\\b(bearer)\\s+[A-Za-z0-9\\-._~+/]+=*")
                  count += bearerRe.findAll(out).count()
                  out = bearerRe.replace(out) { "Bearer [REDACTED]" }

                  // JWT shape: header.payload.signature
                  val jwtRe = Regex("\\beyJ[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9_-]*")
                  count += jwtRe.findAll(out).count()
                  out = jwtRe.replace(out, "[REDACTED:JWT]")

                  // Labeled secrets: api_key=..., token: ..., password=...
                  val labeledRe = Regex(
                      "(?i)\\b(api[_-]?key|apikey|secret|token|password|passwd|client[_-]?secret)\\b\\s*[:=]\\s*\"?([^\\s,\"']{6,})"
                  )
                  count += labeledRe.findAll(out).count()
                  out = labeledRe.replace(out) { m ->
                      m.groupValues[1] + "=[REDACTED]"
                  }

                  // Long hex strings (private keys / hashes)
                  val hexRe = Regex("\\b[0-9a-fA-F]{32,}\\b")
                  count += hexRe.findAll(out).count()
                  out = hexRe.replace(out, "[REDACTED:HEX]")

                  // Email addresses (personal identifiers)
                  val mailRe = Regex("\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b")
                  count += mailRe.findAll(out).count()
                  out = mailRe.replace(out, "[REDACTED:EMAIL]")

                  return Result(out, count)
              }
          }
          CYBEREOF

          cat > app/src/main/java/com/cyberos/app/data/GlobalSearch.kt <<'CYBEREOF'
          package com.cyberos.app.data

          import com.cyberos.app.learning.CyberCurriculum
          import com.cyberos.app.methodology.Methodology

          // Pure search across all object types. Unit-testable.
          object GlobalSearch {

              data class Hit(val kind: String, val ref: String, val title: String, val subtitle: String)

              private const val LIMIT = 8

              fun search(
                  q: String,
                  notes: List<Note>,
                  tasks: List<Task>,
                  projects: List<Project>,
                  meths: List<Methodology>
              ): List<Hit> {
                  val query = q.trim().lowercase()
                  if (query.isEmpty()) return emptyList()
                  val out = mutableListOf<Hit>()

                  var topicCount = 0
                  for (p in CyberCurriculum.paths) {
                      for (t in p.topics) {
                          if (topicCount >= LIMIT) break
                          if (t.title.lowercase().contains(query) || t.summary.lowercase().contains(query)) {
                              out.add(Hit("topic", t.id, t.title, t.summary))
                              topicCount++
                          }
                      }
                  }

                  notes.filter { n ->
                      n.title.lowercase().contains(query) ||
                          n.body.lowercase().contains(query) ||
                          n.tags.any { it.lowercase().contains(query) }
                  }.take(LIMIT).forEach { n ->
                      out.add(Hit("note", n.id.toString(), n.title.ifBlank { "بدون عنوان" }, "ملاحظة"))
                  }

                  tasks.filter { t ->
                      t.title.lowercase().contains(query) || t.notes.lowercase().contains(query)
                  }.take(LIMIT).forEach { t ->
                      out.add(Hit("task", t.id.toString(), t.title, "مهمة"))
                  }

                  projects.filter { p -> p.title.lowercase().contains(query) }
                      .take(LIMIT).forEach { p ->
                          out.add(Hit("project", p.id.toString(), p.title, "مشروع"))
                      }

                  meths.filter { m ->
                      m.title.lowercase().contains(query) ||
                          m.steps.any { it.objective.lowercase().contains(query) }
                  }.take(LIMIT).forEach { m ->
                      out.add(Hit("methodology", m.id.toString(), m.title, "منهجية"))
                  }

                  return out
              }
          }
          CYBEREOF

          cat > app/src/main/java/com/cyberos/app/data/JsonCodec.kt <<'CYBEREOF'
          package com.cyberos.app.data

          import com.cyberos.app.flashcards.Flashcard
          import com.cyberos.app.methodology.Methodology
          import com.cyberos.app.methodology.MethodologyStep
          import org.json.JSONArray
          import org.json.JSONObject

          // Pure JVM JSON codecs - unit-testable without Android.
          object JsonCodec {

              fun notesToJson(notes: List<Note>): String {
                  val a = JSONArray()
                  notes.forEach { n ->
                      a.put(JSONObject().apply {
                          put("id", n.id)
                          put("title", n.title)
                          put("body", n.body)
                          put("tags", JSONArray(n.tags))
                          put("createdAt", n.createdAt)
                          put("updatedAt", n.updatedAt)
                      })
                  }
                  return a.toString()
              }

              fun parseNotes(text: String): List<Note> {
                  val a = JSONArray(text)
                  val out = mutableListOf<Note>()
                  for (i in 0 until a.length()) {
                      val o = a.getJSONObject(i)
                      val tags = mutableListOf<String>()
                      o.optJSONArray("tags")?.let { t ->
                          for (j in 0 until t.length()) tags.add(t.optString(j))
                      }
                      out.add(
                          Note(
                              o.getLong("id"),
                              o.optString("title"),
                              o.optString("body"),
                              tags,
                              o.optLong("createdAt"),
                              o.optLong("updatedAt")
                          )
                      )
                  }
                  return out
              }

              fun flashcardsToJson(cards: List<Flashcard>): String {
                  val a = JSONArray()
                  cards.forEach { c ->
                      a.put(JSONObject().apply {
                          put("id", c.id)
                          if (c.topicId != null) put("topicId", c.topicId) else put("topicId", JSONObject.NULL)
                          put("q", c.question)
                          put("a", c.answer)
                          put("ease", c.ease)
                          put("interval", c.intervalDays)
                          put("reps", c.reps)
                          put("dueAt", c.dueAt)
                          put("source", c.source)
                      })
                  }
                  return a.toString()
              }

              fun parseFlashcards(text: String): List<Flashcard> {
                  val a = JSONArray(text)
                  val out = mutableListOf<Flashcard>()
                  for (i in 0 until a.length()) {
                      val o = a.getJSONObject(i)
                      out.add(
                          Flashcard(
                              o.getLong("id"),
                              if (o.isNull("topicId")) null else o.optString("topicId"),
                              o.optString("q"),
                              o.optString("a"),
                              o.optDouble("ease", 2.5),
                              o.optDouble("interval", 0.0),
                              o.optInt("reps", 0),
                              o.optLong("dueAt", 0L),
                              o.optString("source", "demo")
                          )
                      )
                  }
                  return out
              }

              fun methodologiesToJson(ms: List<Methodology>): String {
                  val a = JSONArray()
                  ms.forEach { m ->
                      a.put(JSONObject().apply {
                          put("id", m.id)
                          put("title", m.title)
                          put("createdAt", m.createdAt)
                          put("updatedAt", m.updatedAt)
                          put("steps", JSONArray().apply {
                              m.steps.forEach { s ->
                                  put(JSONObject().apply {
                                      put("id", s.id)
                                      put("objective", s.objective)
                                      put("done", s.done)
                                  })
                              }
                          })
                      })
                  }
                  return a.toString()
              }

              fun parseMethodologies(text: String): List<Methodology> {
                  val a = JSONArray(text)
                  val out = mutableListOf<Methodology>()
                  for (i in 0 until a.length()) {
                      val o = a.getJSONObject(i)
                      val steps = mutableListOf<MethodologyStep>()
                      o.optJSONArray("steps")?.let { sa ->
                          for (j in 0 until sa.length()) {
                              val so = sa.getJSONObject(j)
                              steps.add(
                                  MethodologyStep(
                                      so.getLong("id"),
                                      so.optString("objective"),
                                      so.optBoolean("done", false)
                                  )
                              )
                          }
                      }
                      out.add(
                          Methodology(
