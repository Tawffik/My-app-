          cat > app/src/main/res/values/themes.xml <<'CYBEREOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="Theme.CyberOS" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/cyber_background</item>
                  <item name="android:statusBarColor">@color/cyber_background</item>
                  <item name="android:navigationBarColor">@color/cyber_background</item>
              </style>
          </resources>
          CYBEREOF

          cat > app/src/main/res/drawable/ic_launcher_foreground.xml <<'CYBEREOF'
          <?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="108dp"
              android:height="108dp"
              android:viewportWidth="108"
              android:viewportHeight="108">
              <path
                  android:fillColor="#00E5A0"
                  android:pathData="M30,36 L50,54 L30,72 L38,72 L58,54 L38,36 Z"/>
              <path
                  android:fillColor="#00E5A0"
                  android:pathData="M60,68 L80,68 L80,74 L60,74 Z"/>
          </vector>
          CYBEREOF

          cat > app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml <<'CYBEREOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          CYBEREOF

          cat > app/src/main/res/xml/network_security_config.xml <<'CYBEREOF'
          <?xml version="1.0" encoding="utf-8"?>
          <network-security-config>
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          CYBEREOF

          cat > app/src/main/res/xml/backup_rules.xml <<'CYBEREOF'
          <?xml version="1.0" encoding="utf-8"?>
          <full-backup-content>
              <exclude domain="file" path="." />
              <exclude domain="sharedpref" path="." />
          </full-backup-content>
          CYBEREOF

          cat > app/src/main/res/xml/data_extraction_rules.xml <<'CYBEREOF'
          <?xml version="1.0" encoding="utf-8"?>
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="file" path="." />
                  <exclude domain="sharedpref" path="." />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="file" path="." />
                  <exclude domain="sharedpref" path="." />
              </device-transfer>
          </data-extraction-rules>
          CYBEREOF

          echo "Generated files:"
          find app -type f | sort

      - name: Build APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace > full_build.log 2>&1
          BUILD_EXIT=$?
          echo ""
          echo "=================================================="
          echo "===== ERROR SUMMARY (only if build failed) ======="
          echo "=================================================="
          grep -B2 -A12 "What went wrong" full_build.log | head -60 || true
          echo ""
          echo "===== ERROR LINES ====="
          grep -nE "^e: |error:|FAILURE|Caused by|licen|Unresolved|Execution failed|AAPT|SDK location|Manifest merger" full_build.log | head -60 || echo "(no error lines found)"
          echo ""
          echo "===== LAST 40 LINES ====="
          tail -40 full_build.log
          echo ""
          echo "BUILD_EXIT_CODE=$BUILD_EXIT"
          echo ""
          echo "===== SURFACING ERRORS AS RED ANNOTATIONS ON RUN PAGE ====="
          grep -E "^e: |What went wrong|Caused by|FAILURE" full_build.log | head -10 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | cut -c1-240)"
          done || true
          exit $BUILD_EXIT

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CyberOS-build-log
          path: full_build.log
          if-no-files-found: ignore

      - name: Package and hash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/CyberOS-v0.2.apk
          (cd release && sha256sum CyberOS-v0.2.apk > CyberOS-v0.2-SHA256.txt)
          cat release/CyberOS-v0.2-SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberOS-v0.2-APK
          path: release/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.2.${{ github.run_number }}" \
            release/CyberOS-v0.2.apk \
            release/CyberOS-v0.2-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "CyberOS v0.2 - AI Assistant" \
            --notes "Adds AI chat assistant with user's own API key, encrypted at rest with Android Keystore. INTERNET permission added (user-initiated AI calls only). Notes remain fully local."
