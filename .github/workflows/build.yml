          import java.util.Locale

          @Composable
          fun CouncilScreen(
              state: CouncilState,
              progress: ProgressState,
              onOpenSettings: () -> Unit
          ) {
              var input by remember { mutableStateOf("") }
              val scope = rememberCoroutineScope()

              Column(
                  Modifier
                      .fillMaxSize()
                      .padding(horizontal = 16.dp)
              ) {
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text(
                          "مجلس الوكلاء",
                          style = MaterialTheme.typography.titleLarge,
                          modifier = Modifier.weight(1f)
                      )
                      IconButton(onClick = onOpenSettings) {
                          Icon(Icons.Filled.Settings, contentDescription = "إعدادات المساعد")
                      }
                  }
                  Text(
                      "3 مراحل: محلل هجومي ثم ناقد ثم مُخلِّص نهائي. صراحة: نفس الموديل بتاعك بيشغّل كل دور بتعليمات مختلفة — مش وكلاء مستقلين. ردود الزملاء بتتحقن كبيانات غير موثوقة.",
                      style = MaterialTheme.typography.labelSmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant
                  )
                  Spacer(Modifier.height(12.dp))

                  state.notice?.let { n ->
                      Surface(
                          color = MaterialTheme.colorScheme.primaryContainer,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text(
                              n,
                              modifier = Modifier.padding(10.dp),
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onPrimaryContainer
                          )
                      }
                      Spacer(Modifier.height(6.dp))
                  }

                  OutlinedTextField(
                      value = input,
                      onValueChange = { input = it },
                      modifier = Modifier.fillMaxWidth(),
                      placeholder = { Text("اسأل سؤال أمني جدّي للمجلس...") },
                      maxLines = 4
                  )
                  Spacer(Modifier.height(8.dp))
                  Button(
                      onClick = {
                          val q = input
                          input = ""
                          scope.launch {
                              if (state.run(q)) progress.addXp(15)
                          }
                      },
                      enabled = !state.running && input.isNotBlank() && state.configured,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("شغّل المجلس (3 استدعاءات)")
                  }

                  if (!state.configured) {
                      Spacer(Modifier.height(8.dp))
                      Text(
                          "محتاج مفتاح API الأول — من زرار الإعدادات فوق.",
                          style = MaterialTheme.typography.bodySmall,
                          color = MaterialTheme.colorScheme.error
                      )
                  }

                  state.error?.let { msg ->
                      Spacer(Modifier.height(8.dp))
                      Surface(
                          color = MaterialTheme.colorScheme.errorContainer,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text(
                              msg,
                              modifier = Modifier.padding(10.dp),
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onErrorContainer
                          )
                      }
                  }

                  if (state.running) {
                      Spacer(Modifier.height(12.dp))
                      val phases = listOf(
                          "1) المحلل الهجومي — بيدرس السؤال",
                          "2) الناقد — بيتحدى تحليل المحلل",
                          "3) المُخلِّص — بيطلع الحكم النهائي"
                      )
                      phases.forEachIndexed { i, label ->
                          Row(
                              verticalAlignment = Alignment.CenterVertically,
                              modifier = Modifier.padding(vertical = 4.dp)
                          ) {
                              if (state.phase == i + 1) {
                                  CircularProgressIndicator(
                                      modifier = Modifier.size(16.dp),
                                      strokeWidth = 2.dp
                                  )
                              } else {
                                  Text(
                                      if (state.phase > i + 1) "✓" else "•",
                                      color = if (state.phase > i + 1)
                                          MaterialTheme.colorScheme.primary
                                      else
                                          MaterialTheme.colorScheme.onSurfaceVariant
                                  )
                              }
                              Spacer(Modifier.width(8.dp))
                              Text(label, style = MaterialTheme.typography.bodySmall)
                          }
                      }
                  }

                  Spacer(Modifier.height(12.dp))
                  Text("الجلسات السابقة", style = MaterialTheme.typography.titleMedium)
                  Spacer(Modifier.height(8.dp))

                  if (state.sessions.isEmpty()) {
                      Text(
                          "مفيش جلسات لسه.",
                          color = MaterialTheme.colorScheme.onSurfaceVariant,
                          style = MaterialTheme.typography.bodySmall
                      )
                  } else {
                      LazyColumn(
                          verticalArrangement = Arrangement.spacedBy(8.dp),
                          contentPadding = PaddingValues(bottom = 16.dp)
                      ) {
                          items(state.sessions, key = { it.id }) { s ->
                              CouncilSessionCard(s)
                          }
                      }
                  }
              }
          }

          @Composable
          private fun CouncilSessionCard(
              s: com.cyberos.app.data.CouncilSession
          ) {
              var expanded by remember(s.id) { mutableStateOf(false) }
              val dateText = remember(s.createdAt) {
                  SimpleDateFormat("d MMM • HH:mm", Locale.getDefault()).format(Date(s.createdAt))
              }

              Card(
                  modifier = Modifier
                      .fillMaxWidth()
                      .clickable { expanded = !expanded }
              ) {
                  Column(Modifier.padding(14.dp)) {
                      Text(s.question, style = MaterialTheme.typography.titleMedium)
                      Text(
                          dateText,
                          style = MaterialTheme.typography.labelSmall,
                          color = MaterialTheme.colorScheme.onSurfaceVariant
                      )
                      Spacer(Modifier.height(8.dp))
                      Text(
                          "الحكم النهائي:",
                          style = MaterialTheme.typography.labelMedium,
                          color = MaterialTheme.colorScheme.primary
                      )
                      Text(s.synthesis, style = MaterialTheme.typography.bodyMedium)
                      if (expanded) {
                          Spacer(Modifier.height(10.dp))
                          Text(
                              "تحليل المحلل:",
                              style = MaterialTheme.typography.labelMedium,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                          Text(
                              s.analyst,
                              style = MaterialTheme.typography.bodySmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                          Spacer(Modifier.height(8.dp))
                          Text(
                              "نقد الناقد:",
                              style = MaterialTheme.typography.labelMedium,
