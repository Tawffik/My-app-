                      .removePrefix("```json").removePrefix("```")
                      .removeSuffix("```").trim()
                  val a = JSONArray(cleaned)
                  val out = mutableListOf<Pair<String, String>>()
                  for (i in 0 until a.length()) {
                      val o = a.getJSONObject(i)
                      val q = o.optString("q").trim()
                      val ans = o.optString("a").trim()
