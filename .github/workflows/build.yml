name: Build CyberOS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (licenses + platform 34)
        run: |
          set -x
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"

          SDKM=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKM="sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            SDKM="$SDK_ROOT/cmdline-tools/bin/sdkmanager"
          fi
          echo "Using sdkmanager: $SDKM"

          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            yes | "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi

          mkdir -p "$SDK_ROOT/licenses" || true
          printf '8933bad161af4178b1185d48a37abf3dab6c1d3d\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK_ROOT/licenses/android-sdk-license" || true

          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Generate CyberOS project files
        run: |
          mkdir -p app/src/main/java/com/cyberos/app/data app/src/main/java/com/cyberos/app/ui/theme app/src/main/java/com/cyberos/app/ui/ai app/src/main/java/com/cyberos/app/ui/notes app/src/main/res/values app/src/main/res/drawable app/src/main/res/xml app/src/main/res/mipmap-anydpi-v26

          cat > settings.gradle.kts <<'CYBEREOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CyberOS"
          include(":app")
          CYBEREOF

          cat > build.gradle.kts <<'CYBEREOF'
          plugins {
              id("com.android.application") version "8.4.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          CYBEREOF

          cat > gradle.properties <<'CYBEREOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          CYBEREOF

          cat > app/build.gradle.kts <<'CYBEREOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.cyberos.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.cyberos.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 2
                  versionName = "0.2.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.11"
              }

              packaging {
                  resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.04.01")
              implementation(composeBom)

              implementation("androidx.core:core-ktx:1.13.0")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          CYBEREOF

          cat > app/proguard-rules.pro <<'CYBEREOF'
          # CyberOS - no app-specific keep rules needed yet.
          # Compose and Material3 ship their own consumer rules.
          CYBEREOF

          cat > app/src/main/AndroidManifest.xml <<'CYBEREOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <!-- v0.2: INTERNET is used ONLY for user-initiated AI chat calls
                   to the provider the user configures with their own API key.
                   Notes and all other data never leave the device. -->
              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="false"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:fullBackupContent="@xml/backup_rules"
                  android:icon="@mipmap/ic_launcher"
                  android:label="CyberOS"
                  android:networkSecurityConfig="@xml/network_security_config"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.CyberOS"
                  android:usesCleartextTraffic="false">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          CYBEREOF

          cat > app/src/main/java/com/cyberos/app/MainActivity.kt <<'CYBEREOF'
          package com.cyberos.app

          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.enableEdgeToEdge
          import com.cyberos.app.ui.CyberOSApp

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  enableEdgeToEdge()
                  setContent {
                      CyberOSApp()
                  }
              }
          }
          CYBEREOF

          cat > app/src/main/java/com/cyberos/app/data/Note.kt <<'CYBEREOF'
          package com.cyberos.app.data

          data class Note(
              val id: Long,
              val title: String,
              val body: String,
              val tags: List<String> = emptyList(),
              val createdAt: Long = 0L,
              val updatedAt: Long = 0L
          )
          CYBEREOF

          cat > app/src/main/java/com/cyberos/app/data/NoteStore.kt <<'CYBEREOF'
          package com.cyberos.app.data

          import android.content.Context
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.File

          // Local, corruption-safe storage (JSON in app-private storage).
          class NoteStore(context: Context) {

              private val file: File = File(context.filesDir, "notes.json")
              private var cache: MutableList<Note> = load()

              fun all(): List<Note> = cache.sortedByDescending { it.updatedAt }

              fun get(id: Long): Note? = cache.firstOrNull { it.id == id }

              fun nextId(): Long = (cache.maxOfOrNull { it.id } ?: 0L) + 1L

              @Synchronized
              fun save(note: Note) {
                  val index = cache.indexOfFirst { it.id == note.id }
                  if (index >= 0) cache[index] = note else cache.add(note)
                  persist()
              }

              @Synchronized
              fun delete(id: Long) {
                  cache.removeAll { it.id == id }
                  persist()
              }

              private fun persist() {
                  try {
                      val array = JSONArray()
                      cache.forEach { note ->
                          array.put(JSONObject().apply {
                              put("id", note.id)
                              put("title", note.title)
                              put("body", note.body)
                              put("tags", JSONArray(note.tags))
                              put("createdAt", note.createdAt)
                              put("updatedAt", note.updatedAt)
                          })
                      }
                      file.writeText(array.toString())
                  } catch (_: Exception) {
                      // Fail safe: never crash on storage errors
                  }
              }

              private fun load(): MutableList<Note> {
                  if (!file.exists()) return mutableListOf()
                  return try {
                      val array = JSONArray(file.readText())
                      val result = mutableListOf<Note>()
                      for (i in 0 until array.length()) {
                          val o = array.getJSONObject(i)
                          val tags = mutableListOf<String>()
                          val tagArray = o.optJSONArray("tags")
                          if (tagArray != null) {
                              for (j in 0 until tagArray.length()) tags.add(tagArray.optString(j))
                          }
                          result.add(
                              Note(
                                  id = o.getLong("id"),
                                  title = o.optString("title"),
                                  body = o.optString("body"),
                                  tags = tags,
                                  createdAt = o.optLong("createdAt"),
                                  updatedAt = o.optLong("updatedAt")
                              )
                          )
                      }
                      result
                  } catch (_: Exception) {
                      mutableListOf()
                  }
              }
          }
          CYBEREOF

          cat > app/src/main/java/com/cyberos/app/data/NotesState.kt <<'CYBEREOF'
          package com.cyberos.app.data

          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue

          class NotesState(private val store: NoteStore) {

              var notes by mutableStateOf(store.all())
                  private set

              var query by mutableStateOf("")

              fun get(id: Long): Note? = store.get(id)

              fun upsert(existingId: Long, title: String, body: String, tags: List<String>) {
                  val now = System.currentTimeMillis()
                  val note = if (existingId > 0) {
                      val old = store.get(existingId) ?: return
                      old.copy(title = title, body = body, tags = tags, updatedAt = now)
                  } else {
                      Note(
                          id = store.nextId(),
                          title = title,
                          body = body,
                          tags = tags,
                          createdAt = now,
                          updatedAt = now
                      )
                  }
                  store.save(note)
                  notes = store.all()
              }

              fun delete(id: Long) {
                  store.delete(id)
                  notes = store.all()
              }

              fun filtered(): List<Note> {
                  val q = query.trim()
                  if (q.isEmpty()) return notes
                  return notes.filter { note ->
                      note.title.contains(q, ignoreCase = true) ||
                          note.body.contains(q, ignoreCase = true) ||
                          note.tags.any { it.contains(q, ignoreCase = true) }
                  }
              }
          }
          CYBEREOF

          cat > app/src/main/java/com/cyberos/app/data/ApiKeyVault.kt <<'CYBEREOF'
          package com.cyberos.app.data

          import android.content.Context
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.util.Base64
          java.security.KeyStore
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec

          // API key vault: the key is encrypted with an AES-256-GCM key that
          // lives inside the Android Keystore and never leaves the secure
          // hardware/TEE. Only ciphertext is stored on disk.
          class ApiKeyVault(context: Context) {

              private val prefs = context.getSharedPreferences("cyberos_vault", Context.MODE_PRIVATE)
              private val alias = "cyberos_ai_key"

              private fun getOrCreateKey(): SecretKey {
                  val ks = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
                  (ks.getKey(alias, null) as? SecretKey)?.let { return it }

                  val kg = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore")
                  kg.init(
                      KeyGenParameterSpec.Builder(alias,
                          KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)
                          .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                          .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                          .setKeySize(256)
                          .build()
                  )
                  return kg.generateKey()
              }

              fun saveApiKey(value: String) {
                  val c = Cipher.getInstance("AES/GCM/NoPadding")
                      .apply { init(Cipher.ENCRYPT_MODE, getOrCreateKey()) }
                  val ct = c.doFinal(value.toByteArray(Charsets.UTF_8))
                  prefs.edit()
                      .putString("k", Base64.encodeToString(ct, Base64.NO_WRAP))
                      .putString("iv", Base64.encodeToString(c.iv, Base64.NO_WRAP))
                      .apply()
              }

              fun loadApiKey(): String? {
                  val k = prefs.getString("k", null) ?: return null
                  val iv = prefs.getString("iv", null) ?: return null
                  return try {
                      val c = Cipher.getInstance("AES/GCM/NoPadding")
                      c.init(
                          Cipher.DECRYPT_MODE, getOrCreateKey(),
                          GCMParameterSpec(128, Base64.decode(iv, Base64.NO_WRAP))
                      )
                      String(c.doFinal(Base64.decode(k, Base64.NO_WRAP)), Charsets.UTF_8)
                  } catch (_: Exception) {
                      null
                  }
              }

              fun wipe() {
                  prefs.edit().clear().apply()
              }
          }
          CYBEREOF

          cat > app/src/main/java/com/cyberos/app/data/AiSettings.kt <<'CYBEREOF'
          package com.cyberos.app.data

          import android.content.Context

          data class AiSettings(
              val baseUrl: String,
              val model: String
          )

          class AiSettingsStore(context: Context) {

              private val prefs = context.getSharedPreferences("cyberos_ai", Context.MODE_PRIVATE)

              fun load(): AiSettings = AiSettings(
                  baseUrl = prefs.getString("base_url", DEFAULT_BASE_URL) ?: DEFAULT_BASE_URL,
                  model = prefs.getString("model", DEFAULT_MODEL) ?: DEFAULT_MODEL
              )

              fun save(s: AiSettings) {
                  prefs.edit()
                      .putString("base_url", s.baseUrl.trim().trimEnd('/'))
                      .putString("model", s.model.trim())
                      .apply()
              }

              companion object {
                  // OpenAI-compatible endpoint. Works with OpenAI, Groq,
                  // OpenRouter and others that implement /chat/completions.
                  const val DEFAULT_BASE_URL = "https://api.openai.com/v1"
                  const val DEFAULT_MODEL = "gpt-4o-mini"
              }
          }
          CYBEREOF

          cat > app/src/main/java/com/cyberos/app/data/AiClient.kt <<'CYBEREOF'
          package com.cyberos.app.data

          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.MediaType.Companion.toMediaType
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import okhttp3.RequestBody.Companion.toRequestBody
          import org.json.JSONArray
          import org.json.JSONObject
          import java.io.IOException
          import java.net.UnknownHostException
          import java.util.concurrent.TimeUnit

          data class AiChatMessage(
              val role: String, // "user" or "assistant"
              val content: String
          )

          sealed class AiResult {
              data class Success(val reply: String) : AiResult()
              data class Failure(val userMessage: String) : AiResult()
          }

          class AiClient {

              private val http = OkHttpClient.Builder()
                  .connectTimeout(20, TimeUnit.SECONDS)
                  .readTimeout(90, TimeUnit.SECONDS)
                  .build()

              suspend fun chat(
                  baseUrl: String,
                  apiKey: String,
                  model: String,
                  history: List<AiChatMessage>
              ): AiResult = withContext(Dispatchers.IO) {
                  if (!baseUrl.startsWith("https://")) {
                      return@withContext AiResult.Failure("عنوان الخدمة لازم يبدأ بـ https:// — راجع الإعدادات.")
                  }
                  try {
                      val messages = JSONArray()
                      messages.put(JSONObject().put("role", "system").put("content", SYSTEM_PROMPT))
                      history.takeLast(12).forEach { m ->
                          messages.put(JSONObject().put("role", m.role).put("content", m.content))
                      }
                      val body = JSONObject()
                          .put("model", model)
                          .put("messages", messages)
                          .put("temperature", 0.3)

                      val req = Request.Builder()
                          .url("$baseUrl/chat/completions")
                          .header("Authorization", "Bearer $apiKey")
                          .post(body.toString().toRequestBody("application/json".toMediaType()))
                          .build()

                      val resp = http.newCall(req).execute()
                      try {
                          when {
                              resp.code == 401 || resp.code == 403 ->
                                  AiResult.Failure("مفتاح API مرفوض (${resp.code}) — راجع المفتاح من الإعدادات.")
                              resp.code == 429 ->
                                  AiResult.Failure("تجاوزت حد الاستخدام (429) — استنى دقيقة وحاول تاني.")
                              !resp.isSuccessful ->
                                  AiResult.Failure("الخدمة ردت بكود ${resp.code} — حاول تاني بعدين.")
                              else -> {
                                  val text = resp.body?.string()
                                  if (text.isNullOrBlank()) {
                                      AiResult.Failure("رد فاضي من الخدمة — حاول تاني.")
                                  } else {
                                      val reply = try {
                                          JSONObject(text).optJSONArray("choices")
                                              ?.optJSONObject(0)
                                              ?.optJSONObject("message")
                                              ?.optString("content")
                                      } catch (_: Exception) { null }
                                      if (reply.isNullOrBlank()) {
                                          AiResult.Failure("رد غير مفهوم من الخدمة.")
                                      } else {
                                          AiResult.Success(reply.trim())
                                      }
                                  }
                              }
                          }
                      } finally {
                          resp.close()
                      }
                  } catch (e: UnknownHostException) {
                      AiResult.Failure("مفيش إنترنت — تحقق من الاتصال وحاول تاني.")
                  } catch (e: IOException) {
                      AiResult.Failure("مشكلة في الاتصال بالخدمة — حاول تاني.")
                  } catch (e: Exception) {
                      AiResult.Failure("حدث خطأ غير متوقع — حاول تاني.")
                  }
              }

              companion object {
                  const val SYSTEM_PROMPT =
                      "You are CyberOS Assistant, a cybersecurity learning helper. " +
                          "Answer concisely and accurately in the user's language (Arabic or English). " +
                          "If you are not certain about a fact (CVE, exploit, researcher), say so explicitly. " +
                          "Never invent sources or CVE identifiers. Educational use only."
              }
          }
          CYBEREOF

          cat > app/src/main/java/com/cyberos/app/data/AiState.kt <<'CYBEREOF'
          package com.cyberos.app.data

          import androidx.compose.runtime.getValue
          import androidx.compose.runtime.mutableStateOf
          import androidx.compose.runtime.setValue

          class AiState(
              private val vault: ApiKeyVault,
              private val settingsStore: AiSettingsStore,
              private val client: AiClient
          ) {
              var messages by mutableStateOf<List<AiChatMessage>>(emptyList())
                  private set
              var busy by mutableStateOf(false)
                  private set
              var error by mutableStateOf<String?>(null)
              var configured by mutableStateOf(false)
                  private set

              init {
                  configured = vault.loadApiKey() != null
              }

              fun markConfigured() {
                  configured = vault.loadApiKey() != null
              }

              fun settings(): AiSettings = settingsStore.load()

              fun saveSettings(newKey: String?, s: AiSettings) {
                  if (!newKey.isNullOrBlank()) vault.saveApiKey(newKey.trim())
                  settingsStore.save(s)
                  markConfigured()
              }

              fun removeKey() {
                  vault.wipe()
                  markConfigured()
              }

              fun clearChat() {
                  messages = emptyList()
                  error = null
              }

              suspend fun send(text: String) {
                  val q = text.trim().take(4000)
                  if (q.isEmpty() || busy) return
                  error = null

                  val key = vault.loadApiKey()
                  if (key.isNullOrBlank()) {
                      configured = false
                      error = "مفيش مفتاح API — افتح الإعدادات ⚙️ وضيفه الأول."
                      return
                  }

                  val s = settingsStore.load()
                  messages = messages + AiChatMessage("user", q)
                  busy = true
                  try {
                      when (val r = client.chat(s.baseUrl, key, s.model, messages)) {
                          is AiResult.Success ->
                              messages = messages + AiChatMessage("assistant", r.reply)
                          is AiResult.Failure ->
                              error = r.userMessage
                      }
                  } finally {
                      busy = false
                  }
              }
          }
          CYBEREOF

