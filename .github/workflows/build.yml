                                      .toEpochDay()
                              }
                              showPicker = false
                          }) { Text("تم") }
                      },
                      dismissButton = {
                          TextButton(onClick = { showPicker = false }) { Text("إلغاء") }
                      }
                  ) {
                      DatePicker(state = pickerState)
                  }
              }

              if (confirmDelete && task != null) {
                  AlertDialog(
                      onDismissRequest = { confirmDelete = false },
                      title = { Text("حذف المهمة؟") },
                      text = { Text("المهمة هتتمسح نهائيًا.") },
                      confirmButton = {
                          TextButton(onClick = {
                              onDelete(task.id)
                              confirmDelete = false
                          }) {
                              Text("حذف", color = MaterialTheme.colorScheme.error)
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { confirmDelete = false }) { Text("إلغاء") }
                      }
                  )
              }
          }
