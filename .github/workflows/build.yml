          @Composable
          fun AiChatScreen(state: AiState, onOpenSettings: () -> Unit) {
              var input by remember { mutableStateOf("") }
              val scope = rememberCoroutineScope()
              val listState = rememberLazyListState()

              LaunchedEffect(state.messages.size) {
                  if (state.messages.isNotEmpty()) {
                      listState.animateScrollToItem(state.messages.size - 1)
                  }
              }

              Column(
                  Modifier
                      .fillMaxSize()
                      .padding(horizontal = 16.dp)
              ) {
                  // Header
                  Row(
                      verticalAlignment = Alignment.CenterVertically,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text(
                          "المساعد الذكي",
                          style = MaterialTheme.typography.titleLarge,
                          modifier = Modifier.weight(1f)
                      )
                      IconButton(
                          onClick = { state.clearChat() },
                          enabled = state.messages.isNotEmpty()
                      ) {
                          Icon(Icons.Filled.Clear, contentDescription = "مسح المحادثة")
                      }
                      IconButton(onClick = onOpenSettings) {
                          Icon(Icons.Filled.Settings, contentDescription = "إعدادات المساعد")
                      }
                  }

                  if (!state.configured) {
                      Column(
                          Modifier
                              .weight(1f)
                              .fillMaxWidth(),
                          horizontalAlignment = Alignment.CenterHorizontally,
                          verticalArrangement = Arrangement.Center
                      ) {
                          Icon(
                              Icons.Filled.Settings, contentDescription = null,
                              modifier = Modifier.size(48.dp),
                              tint = MaterialTheme.colorScheme.primary
                          )
                          Spacer(Modifier.height(12.dp))
                          Text("مفيش مفتاح API مضبوط", style = MaterialTheme.typography.titleMedium)
                          Spacer(Modifier.height(8.dp))
                          Text(
                              "افتح الإعدادات وضيف مفتاحك — بيتخزن مشفّرًا على جهازك بس.",
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                              textAlign = TextAlign.Center
                          )
                          Spacer(Modifier.height(16.dp))
                          Button(onClick = onOpenSettings) { Text("فتح الإعدادات") }
                      }
                  } else {
                      state.error?.let { msg ->
                          Surface(
                              color = MaterialTheme.colorScheme.errorContainer,
                              shape = RoundedCornerShape(8.dp),
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Text(
                                  msg,
                                  color = MaterialTheme.colorScheme.onErrorContainer,
                                  modifier = Modifier.padding(10.dp),
                                  style = MaterialTheme.typography.bodySmall
                              )
                          }
                          Spacer(Modifier.height(6.dp))
                      }

                      LazyColumn(
                          state = listState,
                          modifier = Modifier.weight(1f),
                          verticalArrangement = Arrangement.spacedBy(8.dp),
                          contentPadding = PaddingValues(bottom = 8.dp)
                      ) {
                          items(state.messages.size) { index ->
                              val m = state.messages[index]
                              Row(
                                  Modifier.fillMaxWidth(),
                                  horizontalArrangement =
                                      if (m.role == "user") Arrangement.End else Arrangement.Start
                              ) {
                                  Surface(
                                      color = if (m.role == "user")
                                          MaterialTheme.colorScheme.primaryContainer
                                      else
                                          MaterialTheme.colorScheme.surfaceVariant,
                                      shape = RoundedCornerShape(12.dp)
                                  ) {
                                      Text(
                                          m.content,
                                          Modifier.padding(10.dp),
                                          style = MaterialTheme.typography.bodyMedium
                                      )
                                  }
                              }
                          }
                          if (state.busy) {
                              item {
                                  Row(
                                      Modifier.fillMaxWidth(),
                                      horizontalArrangement = Arrangement.Start
                                  ) {
                                      CircularProgressIndicator(
                                          modifier = Modifier
                                              .size(20.dp)
                                              .padding(start = 10.dp),
                                          strokeWidth = 2.dp
                                      )
                                  }
                              }
                          }
                      }

                      Row(
                          verticalAlignment = Alignment.CenterVertically,
                          modifier = Modifier.padding(bottom = 8.dp)
                      ) {
                          OutlinedTextField(
                              value = input,
                              onValueChange = { input = it },
                              modifier = Modifier.weight(1f),
                              placeholder = { Text("اسأل سؤال أمني...") },
                              maxLines = 4
                          )
                          Spacer(Modifier.width(8.dp))
                          IconButton(
                              onClick = {
                                  val text = input
                                  input = ""
                                  scope.launch { state.send(text) }
                              },
                              enabled = !state.busy && input.isNotBlank()
                          ) {
                              Icon(
                                  Icons.Filled.Send,
                                  contentDescription = "إرسال",
                                  tint = MaterialTheme.colorScheme.primary
                              )
                          }
                      }
                  }
              }
          }
