                          Button({ cardStore.addGenerated(cards.toList()); progress.addXp((cards.size * 3).toLong()); added = true }, Modifier.fillMaxWidth()) {
                              Text("✅ ${Lang.t("Save", "احفظ")} ${cards.size} ${Lang.t("cards", "كروت")}")
                          }
                      }
                  }
              }
