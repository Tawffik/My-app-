                      Text(dueLabel(dueDay) ?: Lang.t("No date", "بدون"), style = MaterialTheme.typography.bodyMedium, color = if (dueDay != null) MaterialTheme.colorScheme.primary else MaterialTheme.colorScheme.onSurfaceVariant, modifier = Modifier.weight(1f))
                      Button({ showPicker = true }) { Text(Lang.t("Pick", "اختر")) }
                      if (dueDay != null) OutlinedButton({ dueDay = null }) { Text(Lang.t("Clear", "إزالة")) }
                  }

                  Spacer(Modifier.height(20.dp))
                  Button({ onSave(title, notes, status, priority, projectId, dueDay) }, enabled = title.isNotBlank(), modifier = Modifier.fillMaxWidth()) { Text(Lang.t("Save", "حفظ")) }
                  if (task != null) {
