          val CyberSurfaceVariant = Color(0xFF1B2432)
          val CyberText = Color(0xFFE6EDF3)
          val CyberTextDim = Color(0xFF8B98A5)
          val CyberDanger = Color(0xFFFF5C5C)
          CYBEREOF

          cat > app/src/main/java/com/cyberos/app/ui/theme/Theme.kt <<'CYBEREOF'
          package com.cyberos.app.ui.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable

          private val CyberColors = darkColorScheme(
              primary = CyberGreen,
              onPrimary = CyberGreenDark,
              primaryContainer = CyberSurfaceVariant,
              onPrimaryContainer = CyberGreen,
              background = CyberBackground,
              onBackground = CyberText,
              surface = CyberSurface,
              onSurface = CyberText,
              surfaceVariant = CyberSurfaceVariant,
              onSurfaceVariant = CyberTextDim,
              error = CyberDanger,
              onError = CyberBackground
