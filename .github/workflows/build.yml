                  assertEquals(2.5, SrsScheduler.schedule(c1, SrsScheduler.GOOD, now).intervalDays, 0.001)
              }
              @Test fun again_resets() {
                  val c1 = SrsScheduler.schedule(card(), SrsScheduler.GOOD, now)
                  val c2 = SrsScheduler.schedule(c1, SrsScheduler.AGAIN, now)
                  assertEquals(0.0, c2.intervalDays, 0.001); assertEquals(0, c2.reps)
              }
              @Test fun ease_floor() {
                  var c = card(); repeat(10) { c = SrsScheduler.schedule(c, SrsScheduler.AGAIN, now) }
                  assertTrue(c.ease >= 1.3)
              }
              @Test fun easy_future() { assertTrue(SrsScheduler.schedule(card(), SrsScheduler.EASY, now).dueAt > now) }
              @Test fun interval_capped() {
                  var c = card(); repeat(40) { c = SrsScheduler.schedule(c, SrsScheduler.EASY, now) }
                  assertTrue(c.intervalDays <= 180.0)
              }
          }
