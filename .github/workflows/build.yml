              fun easy_schedules_in_future() {
                  val c = SrsScheduler.schedule(card(), SrsScheduler.EASY, now)
                  assertTrue(c.dueAt > now)
              }

              @Test
              fun interval_is_capped() {
                  var c = card()
                  repeat(40) { c = SrsScheduler.schedule(c, SrsScheduler.EASY, now) }
                  assertTrue(c.intervalDays <= 180.0)
              }
