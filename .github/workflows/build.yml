          import com.cyberos.app.ui.notes.NoteEditScreen
          import com.cyberos.app.ui.notes.NotesScreen
          import com.cyberos.app.ui.theme.CyberTheme

          @Composable
          fun CyberOSApp() {
              val context = LocalContext.current
              val state = remember { NotesState(NoteStore(context.applicationContext)) }
              val aiState = remember {
                  AiState(
                      ApiKeyVault(context.applicationContext),
                      AiSettingsStore(context.applicationContext),
                      AiClient()
                  )
              }

              // 0 = browsing | -1 = new note | >0 = editing that note id
              var editingId by rememberSaveable { mutableStateOf(0L) }
              var tab by rememberSaveable { mutableStateOf(0) }
              var aiSettingsOpen by rememberSaveable { mutableStateOf(false) }

              CyberTheme {
                  Scaffold(
                      modifier = Modifier.fillMaxSize(),
                      bottomBar = {
                          if (editingId == 0L) {
                              NavigationBar {
                                  NavigationBarItem(
                                      selected = tab == 0,
                                      onClick = { tab = 0; aiSettingsOpen = false },
                                      icon = { Icon(Icons.Filled.Edit, contentDescription = null) },
                                      label = { Text("الملاحظات") }
                                  )
                                  NavigationBarItem(
                                      selected = tab == 1,
                                      onClick = { tab = 1; aiSettingsOpen = false },
                                      icon = { Icon(Icons.Filled.PlayArrow, contentDescription = null) },
                                      label = { Text("تعلّم") }
                                  )
                                  NavigationBarItem(
                                      selected = tab == 2,
                                      onClick = { tab = 2 },
                                      icon = { Icon(Icons.Filled.Info, contentDescription = null) },
                                      label = { Text("AI") }
                                  )
                              }
                          }
                      },
                      floatingActionButton = {
                          if (editingId == 0L && tab == 0) {
                              FloatingActionButton(onClick = { editingId = -1L }) {
                                  Icon(Icons.Filled.Add, contentDescription = "ملاحظة جديدة")
                              }
                          }
                      }
                  ) { padding ->
                      Box(
                          Modifier
                              .fillMaxSize()
                              .padding(padding)
                      ) {
                          when {
                              editingId != 0L -> NoteEditScreen(
                                  note = if (editingId > 0) state.get(editingId) else null,
                                  onBack = { editingId = 0L },
                                  onSave = { title, body, tags ->
                                      state.upsert(editingId, title, body, tags)
                                      editingId = 0L
                                  }
                              )
                              tab == 0 -> NotesScreen(state, onOpen = { id -> editingId = id })
                              tab == 1 -> PlaceholderScreen(
                                  title = "المسارات التعليمية",
                                  message = "قادمة في v0.3 — مسارات أمن المعلومات، XP، وتتبّع تقدّم."
                              )
                              aiSettingsOpen -> AiSettingsScreen(
                                  state = aiState,
                                  onBack = { aiSettingsOpen = false }
                              )
                              else -> AiChatScreen(
                                  state = aiState,
                                  onOpenSettings = { aiSettingsOpen = true }
                              )
                          }
                      }
                  }
              }
          }
