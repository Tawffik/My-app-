                                      "أي تطبيق بيسجل نفس filter يقدر يستقبل البيانات."),
                                  QuizQuestion("إزاي تحمي Provider مصدّر؟",
                                      listOf("تغيير اسمه","إخفاؤه","obfuscation","custom permission"),3,
                                      "الـ custom permission تحدد مين يقرا/يكتب.")
                              )
                          ),
                          TopicData(
                              id = "webview-security", title = "WebView Security",
                              summary = "A browser inside your app.",
                              sections = listOf(
                                  TopicSection("Dangerous settings", "javaScriptEnabled مع محتوى غير موثوق، addJavascriptInterface، allowFileAccess."),
                                  TopicSection("JS bridge flaw", "object callable من JS لو WebView بيحمل محتوى خارجي."),
                                  TopicSection("Rules", "محتوى موثوق بس، منع file:// access.")
                              ),
                              related = listOf("components-android", "manifest-security"),
                              flashcards = listOf(
                                  "ليه addJavascriptInterface خطر؟" to "يعرّض methods للـ JS الخبيث.",
                                  "خطر allowFileAccess؟" to "JS يقرا ملفات محلية عبر file://."
                              ),
                              quiz = listOf(
                                  QuizQuestion("ليه addJavascriptInterface خطر؟",
                                      listOf("يعرّض methods للـ JS","يبطّئ","يمنع cookies","يكسر layout"),0,
                                      "JS الخبيث ينادي methods الجسر."),
                                  QuizQuestion("allowFileAccess يسمح بإيه؟",
                                      listOf("صور أسرع","PDF","offline","JS يقرا ملفات محلية"),3,
                                      "file:// URLs تخلي JS يقرا ملفات الجهاز.")
                              )
                          )
                      )
                  )
              )

              fun findTopic(id: String): TopicData? {
                  for (p in paths) for (t in p.topics) if (t.id == id) return t
                  return null
              }

              fun topicTitle(id: String): String = findTopic(id)?.title ?: id
              fun totalTopics(): Int = paths.sumOf { it.topics.size }

              fun firstIncompleteTopic(isDone: (String) -> Boolean): TopicData? {
                  for (p in paths) for (t in p.topics) if (!isDone(t.id)) return t
                  return null
              }

              fun allFlashcards(): List<Triple<String, String, String>> {
                  val out = mutableListOf<Triple<String, String, String>>()
                  for (p in paths) for (t in p.topics) for (fc in t.flashcards) {
                      out.add(Triple(t.id, fc.first, fc.second))
                  }
                  return out
              }
          }
          CYBEREOF

          echo "Learning content generated:"
