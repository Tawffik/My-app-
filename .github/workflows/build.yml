      - name: Run tests and build APK (tests gate the build)
        run: |
          set +e
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace > full_build.log 2>&1
          BUILD_EXIT=$?
          echo ""
          echo "===== UNIT TEST SUMMARY ====="
          grep -E "> Task :app:test|FAILED|passed|BUILD (SUCCESSFUL|FAILED)" full_build.log | tail -30 || true
          echo ""
          echo "===== ERROR SUMMARY (if failed) ====="
          grep -B2 -A12 "What went wrong" full_build.log | head -60 || true
          echo ""
          echo "===== ERROR LINES ====="
          grep -nE "^e: |error:|FAILURE|Unresolved|Execution failed|Test.*FAILED" full_build.log | head -60 || echo "(no error lines found)"
          echo ""
          echo "===== LAST 40 LINES ====="
          tail -40 full_build.log
          echo ""
          echo "BUILD_EXIT_CODE=$BUILD_EXIT"
          echo ""
          grep -E "^e: |What went wrong|Test.*FAILED" full_build.log | head -10 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | cut -c1-240)"
          done || true
          exit $BUILD_EXIT

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CyberOS-build-log
          path: full_build.log
          if-no-files-found: ignore

      - name: Upload test results (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CyberOS-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Package and hash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/CyberOS-v0.5.apk
          (cd release && sha256sum CyberOS-v0.5.apk > CyberOS-v0.5-SHA256.txt)
          cat release/CyberOS-v0.5-SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberOS-v0.5-APK
          path: release/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.5.${{ github.run_number }}" \
            release/CyberOS-v0.5.apk \
            release/CyberOS-v0.5-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "CyberOS v0.5 - Professional Workspace" \
            --notes "Tasks with statuses/priorities/due-dates, projects (with safe deletion), global search across all objects, Pomodoro focus timer, and an automatic secrets redaction engine before any AI request (keys/tokens/JWTs/emails). ~21 unit tests gate the APK build."
