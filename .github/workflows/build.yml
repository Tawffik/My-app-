      - name: Run tests and build APK
        run: |
          set +e
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace > full_build.log 2>&1
          BUILD_EXIT=$?
          echo "===== UNIT TEST SUMMARY ====="
          grep -E "> Task :app:test|FAILED|BUILD (SUCCESSFUL|FAILED)" full_build.log | tail -30 || true
          echo "===== ERROR LINES ====="
          grep -nE "^e: |FAILURE|Unresolved|Test.*FAILED" full_build.log | head -40 || echo "(clean)"
          echo "===== LAST 30 LINES ====="
          tail -30 full_build.log
          echo "BUILD_EXIT_CODE=$BUILD_EXIT"
          grep -E "^e: " full_build.log | head -5 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | cut -c1-200)"
          done || true
          exit $BUILD_EXIT

      - name: Upload build log (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CyberOS-build-log
          path: full_build.log
          if-no-files-found: ignore

      - name: Upload test results (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CyberOS-test-results
          path: app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore

      - name: Package and hash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/CyberOS-v1.0.apk
          (cd release && sha256sum CyberOS-v1.0.apk > CyberOS-v1.0-SHA256.txt)
          cat release/CyberOS-v1.0-SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CyberOS-v1.0-APK
          path: release/

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v1.0.${{ github.run_number }}" \
            release/CyberOS-v1.0.apk \
            release/CyberOS-v1.0-SHA256.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "CyberOS v1.0.0" \
            --notes "Complete: notes + wiki-links, tasks + projects, learning paths (18 topics + quizzes), flashcards (SM-2), challenge mode (6 AI-graded scenarios), AI assistant (4 modes, council, card generation, mini-RAG, redaction engine), search, focus timer, backup. ~50 unit tests gate the build."
