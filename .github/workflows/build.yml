name: Build CyberOS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (licenses + platform 34)
        run: |
          set -x
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          SDKM=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKM="sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            SDKM="$SDK_ROOT/cmdline-tools/bin/sdkmanager"
          fi
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            yes | "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          mkdir -p "$SDK_ROOT/licenses" || true
          printf '8933bad161af4178b1185d48a37abf3dab6c1d3d\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK_ROOT/licenses/android-sdk-license" || true
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Run tests and build APK
        run: |
          set +e
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace > full_build.log 2>&1
          BUILD_EXIT=$?
          echo "===== TEST SUMMARY ====="
          grep -E "> Task :app:test|FAILED|BUILD (SUCCESSFUL|FAILED)" full_build.log | tail -20 || true
          echo "===== ERRORS ====="
          grep -nE "^e: |FAILURE|Unresolved|Test.*FAILED" full_build.log | head -30 || echo "(clean)"
          echo "===== LAST 20 ====="
          tail -20 full_build.log
          grep -E "^e: " full_build.log | head -5 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | cut -c1-200)"
          done || true
          exit $BUILD_EXIT

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CyberOS-build-log
          path: full_build.log
          if-no-files-found: ignore

      - name: Package and hash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/CyberOS-v1.0.apk
          (cd release && sha256sum CyberOS-v1.0.apk > CyberOS-v1.0-SHA256.txt)
          cat release/CyberOS-v1.0-SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberOS-v1.0-APK
          path: release/

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release/CyberOS-v1.0.apk \
              release/CyberOS-v1.0-SHA256.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              release/CyberOS-v1.0.apk \
              release/CyberOS-v1.0-SHA256.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "CyberOS v1.0.0" \
              --notes "Automated build from source tree (no code generation in CI)."
          fi
