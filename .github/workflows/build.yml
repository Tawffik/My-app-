                      OutlinedButton({ confirmDelete = true }, Modifier.fillMaxWidth()) {
                          Icon(Icons.Filled.Delete, null, tint = MaterialTheme.colorScheme.error); Spacer(Modifier.width(6.dp))
                          Text(Lang.t("Delete Task", "حذف"), color = MaterialTheme.colorScheme.error)
                      }
                  }
              }

              if (showPicker) {
                  DatePickerDialog(
                      onDismissRequest = { showPicker = false },
                      confirmButton = { TextButton({ pickerState.selectedDateMillis?.let { ms -> dueDay = Instant.ofEpochMilli(ms).atZone(ZoneOffset.UTC).toLocalDate().toEpochDay() }; showPicker = false }) { Text("OK") } },
                      dismissButton = { TextButton({ showPicker = false }) { Text(Lang.t("Cancel", "إلغاء")) } }
                  ) { DatePicker(state = pickerState) }
              }
              if (confirmDelete && task != null) {
                  AlertDialog({ confirmDelete = false }, { Text(Lang.t("Delete?", "حذف؟")) }, { Text("...") },
                      { TextButton({ onDelete(task.id); confirmDelete = false }) { Text(Lang.t("Delete", "حذف"), color = MaterialTheme.colorScheme.error) } },
                      { TextButton({ confirmDelete = false }) { Text(Lang.t("Cancel", "إلغاء")) } }
                  )
              }
          }
