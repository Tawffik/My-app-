name: Build CyberOS APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK (licenses + platform 34)
        run: |
          set -x
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          export ANDROID_HOME="$SDK_ROOT"
          export ANDROID_SDK_ROOT="$SDK_ROOT"
          SDKM=""
          if command -v sdkmanager >/dev/null 2>&1; then
            SDKM="sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKM="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          elif [ -x "$SDK_ROOT/cmdline-tools/bin/sdkmanager" ]; then
            SDKM="$SDK_ROOT/cmdline-tools/bin/sdkmanager"
          fi
          if [ -n "$SDKM" ]; then
            yes | "$SDKM" --licenses > /dev/null 2>&1 || true
            yes | "$SDKM" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null 2>&1 || true
          fi
          mkdir -p "$SDK_ROOT/licenses" || true
          printf '8933bad161af4178b1185d48a37abf3dab6c1d3d\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n' > "$SDK_ROOT/licenses/android-sdk-license" || true
          echo "sdk.dir=$SDK_ROOT" > local.properties

      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Generate CyberOS project files
        run: |
          mkdir -p app/src/main/java/com/cyberos/app/data app/src/main/java/com/cyberos/app/learning app/src/main/java/com/cyberos/app/flashcards app/src/main/java/com/cyberos/app/methodology app/src/main/java/com/cyberos/app/ui/theme app/src/main/java/com/cyberos/app/ui/ai app/src/main/java/com/cyberos/app/ui/notes app/src/main/java/com/cyberos/app/ui/home app/src/main/java/com/cyberos/app/ui/learning app/src/main/java/com/cyberos/app/ui/review app/src/main/java/com/cyberos/app/ui/methodology app/src/main/java/com/cyberos/app/ui/tasks app/src/main/java/com/cyberos/app/ui/search app/src/main/java/com/cyberos/app/ui/focus app/src/main/res/values app/src/main/res/drawable app/src/main/res/xml app/src/main/res/mipmap-anydpi-v26 app/src/test/java/com/cyberos/app

          cat > settings.gradle.kts <<'CYBEREOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CyberOS"
          include(":app")
          CYBEREOF

          cat > build.gradle.kts <<'CYBEREOF'
          plugins {
              id("com.android.application") version "8.4.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.23" apply false
          }
          CYBEREOF

          cat > gradle.properties <<'CYBEREOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          kotlin.code.style=official
          CYBEREOF

          cat > app/build.gradle.kts <<'CYBEREOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.cyberos.app"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.cyberos.app"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 5
                  versionName = "0.5.0"
              }

              buildTypes {
                  release {
                      isMinifyEnabled = true
                      isShrinkResources = true
                      proguardFiles(
                          getDefaultProguardFile("proguard-android-optimize.txt"),
                          "proguard-rules.pro"
                      )
                  }
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.11"
              }

              packaging {
                  resources.excludes += "/META-INF/{AL2.0,LGPL2.1}"
              }
          }

          dependencies {
              val composeBom = platform("androidx.compose:compose-bom:2024.04.01")
              implementation(composeBom)

              implementation("androidx.core:core-ktx:1.13.0")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-core")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3")
              debugImplementation("androidx.compose.ui:ui-tooling")

              testImplementation("junit:junit:4.13.2")
              testImplementation("org.json:json:20240303")
          }
          CYBEREOF

          cat > app/proguard-rules.pro <<'CYBEREOF'
          # CyberOS - no app-specific keep rules needed yet.
          CYBEREOF

          cat > app/src/main/AndroidManifest.xml <<'CYBEREOF'
