          @Composable
          fun CyberTheme(content: @Composable () -> Unit) {
              MaterialTheme(
                  colorScheme = CyberColors,
                  content = content
              )
          }
          CYBEREOF

          cat > app/src/main/java/com/cyberos/app/ui/Common.kt <<'CYBEREOF'
