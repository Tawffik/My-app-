          @Composable
          fun ReviewScreen(review: ReviewState, progress: ProgressState) {
              LaunchedEffect(Unit) { review.start() }

              Column(
                  Modifier
                      .fillMaxSize()
                      .verticalScroll(rememberScrollState())
                      .padding(16.dp)
              ) {
                  Text("مراجعة اليوم", style = MaterialTheme.typography.headlineSmall)
                  Text(
