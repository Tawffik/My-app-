      - name: Run tests and build APK
        run: |
          set +e
          gradle testDebugUnitTest assembleDebug --no-daemon --stacktrace > full_build.log 2>&1
          BUILD_EXIT=$?
          echo "===== TEST SUMMARY ====="
          grep -E "> Task :app:test|FAILED|BUILD (SUCCESSFUL|FAILED)" full_build.log | tail -20 || true
          echo "===== ERRORS ====="
          grep -nE "^e: |FAILURE|Unresolved|Test.*FAILED" full_build.log | head -30 || echo "(clean)"
          echo "===== LAST 20 ====="
          tail -20 full_build.log
          grep -E "^e: " full_build.log | head -5 | while IFS= read -r line; do
            echo "::error::$(printf '%s' "$line" | cut -c1-200)"
          done || true
          exit $BUILD_EXIT

      - name: Upload logs (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CyberOS-build-log
          path: full_build.log
          if-no-files-found: ignore

      - name: Package and hash
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/app-debug.apk release/CyberOS-v1.0.apk
          (cd release && sha256sum CyberOS-v1.0.apk > CyberOS-v1.0-SHA256.txt)
          cat release/CyberOS-v1.0-SHA256.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CyberOS-v1.0-APK
          path: release/

      - name: Publish Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.${{ github.run_number }}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              release/CyberOS-v1.0.apk \
              release/CyberOS-v1.0-SHA256.txt \
              --repo "$GITHUB_REPOSITORY" \
              --clobber
          else
            gh release create "$TAG" \
              release/CyberOS-v1.0.apk \
              release/CyberOS-v1.0-SHA256.txt \
              --repo "$GITHUB_REPOSITORY" \
              --title "CyberOS v1.0.0" \
              --notes "Complete build: notes + wiki-links, tasks + projects, 18 learning topics + quizzes, SM-2 flashcards, 6 AI-graded challenges, AI assistant (modes, council, card-gen, mini-RAG, redaction), search, focus, backup. ~50 tests gate the build."
          fi
