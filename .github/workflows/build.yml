          import com.cyberos.app.learning.ProgressState
          import com.cyberos.app.ui.EmptyState
          import com.cyberos.app.ui.lang.Lang

          @Composable
          fun ProjectDetailScreen(
              projectState: ProjectState, taskState: TaskState, progress: ProgressState,
              id: Long, onBack: () -> Unit, onOpenTask: (Long) -> Unit
          ) {
              val p = projectState.get(id) ?: run {
                  Column(Modifier.fillMaxSize()) { OutlinedButton(onBack) { Text("←") }; EmptyState(Lang.t("Not found", "مش موجود")) }
                  return
              }
              var title by remember(p.id) { mutableStateOf(p.title) }
              var newTask by remember { mutableStateOf("") }
              var deleteTaskTarget by remember { mutableStateOf<Task?>(null) }
              var confirmDeleteProject by remember { mutableStateOf(false) }

              val projectTasks = taskState.tasks.filter { it.projectId == id }
              val doneCount = projectTasks.count { it.status == TaskFields.DONE }
              val frac = if (projectTasks.isEmpty()) 0f else doneCount.toFloat() / projectTasks.size

              Column(Modifier.fillMaxSize().padding(16.dp)) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      OutlinedButton(onBack) { Text(p.emoji) }
                      Spacer(Modifier.width(8.dp))
                      Text("${p.emoji} ${p.title}", style = MaterialTheme.typography.titleLarge)
                  }
                  Spacer(Modifier.height(10.dp))
                  LinearProgressIndicator(progress = { frac }, modifier = Modifier.fillMaxWidth())
                  Text("$doneCount / ${projectTasks.size}", style = MaterialTheme.typography.labelSmall, color = MaterialTheme.colorScheme.primary)

                  Spacer(Modifier.height(10.dp))
                  Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      OutlinedTextField(newTask, { newTask = it }, Modifier.weight(1f), placeholder = { Text(Lang.t("New task...", "مهمة جديدة...")) }, singleLine = true)
                      Button({ taskState.upsert(-1L, newTask, "", TaskFields.TODO, TaskFields.MEDIUM, id, null); newTask = "" }, enabled = newTask.isNotBlank()) { Icon(Icons.Filled.Add, null) }
                  }
                  Spacer(Modifier.height(10.dp))
                  if (projectTasks.isEmpty()) {
                      Text(Lang.t("No tasks in this project.", "مفيش مهام."), color = MaterialTheme.colorScheme.onSurfaceVariant)
                  } else {
                      LazyColumn(Modifier.weight(1f), verticalArrangement = Arrangement.spacedBy(6.dp)) {
                          items(projectTasks, key = { it.id }) { t ->
                              TaskCard(t, null, { onOpenTask(t.id) }, {
                                  val wasDone = t.status == TaskFields.DONE; taskState.toggleDone(t.id); if (!wasDone) progress.addXp(5)
                              }, { deleteTaskTarget = t })
                          }
                      }
                  }
                  Spacer(Modifier.height(10.dp))
                  OutlinedTextField(title, { title = it }, Modifier.fillMaxWidth(), label = { Text(Lang.t("Rename", "إعادة تسمية")) }, singleLine = true)
                  Spacer(Modifier.height(6.dp))
                  Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                      Button({ projectState.rename(id, title) }, Modifier.weight(1f)) { Text(Lang.t("Save name", "حفظ")) }
                      OutlinedButton({ confirmDeleteProject = true }, Modifier.weight(1f)) { Text(Lang.t("Delete project", "حذف المشروع"), color = MaterialTheme.colorScheme.error) }
                  }
              }

              if (deleteTaskTarget != null) {
                  AlertDialog({ deleteTaskTarget = null }, { Text("Delete?") }, { Text("...") },
                      { TextButton({ deleteTaskTarget?.let { taskState.delete(it.id) }; deleteTaskTarget = null }) { Text(Lang.t("Delete", "حذف"), color = MaterialTheme.colorScheme.error) } },
                      { TextButton({ deleteTaskTarget = null }) { Text("Cancel") } })
              }
              if (confirmDeleteProject) {
                  AlertDialog({ confirmDeleteProject = false }, { Text(Lang.t("Delete project?", "حذف المشروع؟")) },
                      { Text(Lang.t("Tasks survive — data safety.", "المهام بتفضل (سلامة بيانات).")) },
                      { TextButton({ taskState.detachFromProject(id); projectState.delete(id); confirmDeleteProject = false; onBack() }) { Text(Lang.t("Delete", "حذف"), color = MaterialTheme.colorScheme.error) } },
                      { TextButton({ confirmDeleteProject = false }) { Text(Lang.t("Cancel", "إلغاء")) } })
              }
          }
