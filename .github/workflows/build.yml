                          onClick = { onSave(title.trim(), body, parseTags(tagsRaw)) },
                          enabled = title.isNotBlank() || body.isNotBlank()
                      ) {
                          Text("حفظ")
                      }
                  }

                  Spacer(Modifier.height(12.dp))
                  OutlinedTextField(
                      value = tagsRaw,
                      onValueChange = { tagsRaw = it },
                      modifier = Modifier.fillMaxWidth(),
                      placeholder = { Text("وسوم مفصولة بفاصلة: أمن شبكات، ثغرات...") },
                      singleLine = true
                  )

                  Spacer(Modifier.height(12.dp))
                  OutlinedTextField(
                      value = body,
                      onValueChange = { body = it },
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1f),
                      placeholder = { Text("اكتب ملاحظتك هنا...") }
                  )

                  Spacer(Modifier.height(8.dp))
                  OutlinedButton(
                      onClick = { onAskAi(title.ifBlank { "ملاحظة" }, body) },
                      enabled = body.isNotBlank(),
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("اسأل الـ AI عن الملاحظة دي (سياق آمن + إخفاء أسرار)")
                  }
              }
          }

          private fun parseTags(raw: String): List<String> =
              raw.split(',', '،')
                  .map { it.trim() }
                  .filter { it.isNotEmpty() }
                  .distinct()
