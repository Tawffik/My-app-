          import java.text.SimpleDateFormat
          import java.util.Date
          import java.util.Locale

          @Composable
          fun NotesScreen(state: NotesState, onOpen: (Long) -> Unit) {
              var deleteTarget by remember { mutableStateOf<Note?>(null) }

              Column(
                  Modifier
                      .fillMaxSize()
                      .padding(horizontal = 16.dp)
              ) {
                  Spacer(Modifier.height(8.dp))
                  OutlinedTextField(
                      value = state.query,
                      onValueChange = { state.query = it },
                      modifier = Modifier.fillMaxWidth(),
                      placeholder = { Text("بحث في العنوان والمحتوى والوسوم...") },
                      leadingIcon = { Icon(Icons.Filled.Search, contentDescription = null) },
                      singleLine = true
                  )
                  Spacer(Modifier.height(8.dp))

                  val list = state.filtered()
                  if (list.isEmpty()) {
                      EmptyState(
                          if (state.query.isBlank())
                              "مفيش ملاحظات لسه. اضغط زرار + لإضافة أول ملاحظة."
                          else
                              "مفيش نتائج مطابقة للبحث."
                      )
                  } else {
                      LazyColumn(
                          verticalArrangement = Arrangement.spacedBy(8.dp),
                          contentPadding = PaddingValues(bottom = 16.dp)
                      ) {
                          items(list, key = { it.id }) { note ->
                              NoteCard(
                                  note = note,
                                  onOpen = { onOpen(note.id) },
                                  onDelete = { deleteTarget = note }
                              )
                          }
                      }
                  }
              }

              if (deleteTarget != null) {
                  AlertDialog(
                      onDismissRequest = { deleteTarget = null },
                      title = { Text("حذف الملاحظة؟") },
                      text = { Text("الملاحظة هتتمسح نهائيًا ومش هتقدر تستعيدها.") },
                      confirmButton = {
                          TextButton(onClick = {
                              deleteTarget?.let { state.delete(it.id) }
                              deleteTarget = null
                          }) {
                              Text("حذف", color = MaterialTheme.colorScheme.error)
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { deleteTarget = null }) {
                              Text("إلغاء")
                          }
                      }
                  )
              }
          }

          @Composable
          private fun NoteCard(note: Note, onOpen: () -> Unit, onDelete: () -> Unit) {
              val dateText = remember(note.updatedAt) {
                  SimpleDateFormat("d MMM yyyy • HH:mm", Locale.getDefault())
                      .format(Date(note.updatedAt))
              }

              Card(modifier = Modifier.fillMaxWidth()) {
                  Column(
                      Modifier
                          .clickable(onClick = onOpen)
                          .padding(14.dp)
                  ) {
                      Row(verticalAlignment = Alignment.CenterVertically) {
                          Text(
                              note.title.ifBlank { "بدون عنوان" },
                              style = MaterialTheme.typography.titleMedium,
                              maxLines = 1,
                              overflow = TextOverflow.Ellipsis,
                              modifier = Modifier.weight(1f)
                          )
                          IconButton(onClick = onDelete) {
                              Icon(
                                  Icons.Filled.Delete,
                                  contentDescription = "حذف",
                                  tint = MaterialTheme.colorScheme.error
                              )
                          }
                      }
                      if (note.body.isNotBlank()) {
                          Spacer(Modifier.height(4.dp))
                          Text(
                              note.body,
                              style = MaterialTheme.typography.bodyMedium,
                              color = MaterialTheme.colorScheme.onSurfaceVariant,
                              maxLines = 2,
                              overflow = TextOverflow.Ellipsis
                          )
                      }
                      Spacer(Modifier.height(8.dp))
                      Row(
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          note.tags.take(4).forEach { tag ->
                              Text(
                                  "#$tag",
                                  style = MaterialTheme.typography.labelMedium,
                                  color = MaterialTheme.colorScheme.primary
                              )
                          }
                          Spacer(Modifier.weight(1f))
                          Text(
                              dateText,
                              style = MaterialTheme.typography.labelSmall,
                              color = MaterialTheme.colorScheme.onSurfaceVariant
                          )
                      }
                  }
              }
          }
