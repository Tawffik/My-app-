          @Composable
          fun AiSettingsScreen(state: AiState, onBack: () -> Unit) {
              val current = state.settings()
              var apiKey by remember { mutableStateOf("") }
              var baseUrl by remember { mutableStateOf(current.baseUrl) }
              var model by remember { mutableStateOf(current.model) }
              var confirmWipe by remember { mutableStateOf(false) }

              Column(
                  Modifier
                      .fillMaxSize()
                      .padding(16.dp)
              ) {
                  Row(verticalAlignment = Alignment.CenterVertically) {
                      IconButton(onClick = onBack) {
                          Icon(Icons.Filled.ArrowBack, contentDescription = "رجوع")
                      }
                      Spacer(Modifier.width(8.dp))
                      Text("إعدادات المساعد", style = MaterialTheme.typography.titleLarge)
                  }

                  Spacer(Modifier.height(16.dp))

                  if (state.configured) {
                      Text(
                          "✔ مفتاح API موجود ومخزّن مشفّرًا. سيب الخانة فاضية عشان تحافظ عليه، أو اكتب مفتاح جديد عشان تبدّله.",
                          style = MaterialTheme.typography.bodySmall,
                          color = MaterialTheme.colorScheme.primary
                      )
                      Spacer(Modifier.height(8.dp))
                  }

                  OutlinedTextField(
                      value = apiKey,
                      onValueChange = { apiKey = it },
                      modifier = Modifier.fillMaxWidth(),
                      label = { Text("مفتاح API") },
                      placeholder = { Text("sk-...") },
                      visualTransformation = PasswordVisualTransformation(),
                      singleLine = true
                  )
                  Spacer(Modifier.height(12.dp))
                  OutlinedTextField(
                      value = baseUrl,
                      onValueChange = { baseUrl = it },
                      modifier = Modifier.fillMaxWidth(),
                      label = { Text("عنوان الخدمة (Base URL)") },
                      singleLine = true
                  )
                  Spacer(Modifier.height(12.dp))
                  OutlinedTextField(
                      value = model,
                      onValueChange = { model = it },
                      modifier = Modifier.fillMaxWidth(),
                      label = { Text("اسم الموديل") },
                      singleLine = true
                  )

                  Spacer(Modifier.height(16.dp))
                  Button(
                      onClick = {
                          state.saveSettings(apiKey.ifBlank { null }, AiSettings(baseUrl, model))
                          onBack()
                      },
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Text("حفظ")
                  }

                  Spacer(Modifier.height(8.dp))
                  if (state.configured) {
                      OutlinedButton(
                          onClick = { confirmWipe = true },
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text("حذف المفتاح من الجهاز", color = MaterialTheme.colorScheme.error)
                      }
                  }

                  Spacer(Modifier.height(16.dp))
                  Text(
                      "🔒 مفتاحك بيتخزن مشفّرًا بـ Android Keystore — مش نص عادي، ومش بيتفك تشفيره غير وقت سؤالك. " +
                          "الكلام اللي بتكتبه في المحادثة بس هو اللي بيروح للخدمة اللي انت حددتها. " +
                          "ملاحظاتك عمرها ما بتتبعت لأي حد.",
                      style = MaterialTheme.typography.bodySmall,
                      color = MaterialTheme.colorScheme.onSurfaceVariant
                  )
              }

              if (confirmWipe) {
                  AlertDialog(
                      onDismissRequest = { confirmWipe = false },
                      title = { Text("حذف المفتاح؟") },
                      text = { Text("المحادثة هتفضل موجودة، بس المساعد مش هيشتغل لحد ما تضيف مفتاح جديد.") },
                      confirmButton = {
                          TextButton(onClick = {
                              state.removeKey()
                              confirmWipe = false
                          }) {
                              Text("حذف", color = MaterialTheme.colorScheme.error)
                          }
                      },
                      dismissButton = {
                          TextButton(onClick = { confirmWipe = false }) { Text("إلغاء") }
                      }
                  )
              }
          }
